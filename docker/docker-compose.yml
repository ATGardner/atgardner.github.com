version: '3.5'
services:
  site:
    command: jekyll serve --incremental
    environment:
      - FORCE_POLLING=true
    image: jekyll/jekyll:latest@sha256:9964cb159c2c423444985a7ee546f7817ddede8126ef64f188feee5dd02a9cb4
    volumes:
      - ..:/srv/jekyll
      - ../vendor/bundle:/usr/local/bundle
    ports:
      - 4000:4000
      - 35729:35729
      - 3000:3000
      - 80:4000
